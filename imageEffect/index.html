        * {

        .canvas {
          width: 100vw;

          display: flex;
          justify-content: center;
          align-items: center;
        }
        .btn {
          width: 100%;
          position: fixed;
          bottom: 25px;
          display: flex;
          justify-content: center;
        }
        .nav {
          border-radius: 50%;
          position: relative;
        }
        .nav svg {
          width: 50px;
          height: 50px;
          position: absolute;
          left: 10px;
          top: 5px;
        }
        .btn input {
          width: 70px;
          height: 70px;
          /* font-size: 18px;
          border-radius: 50%; */
          opacity: 0;
        }
        #select {
          position: fixed;
          top: 20px;
          left: 20px;
          width: 70px;
          height: 30px;
        }
        .preview {
          position: fixed;
          top: 0;
          width: 100vw;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 50px 0;
        }
        .preview img {
          width: 30px;
        }
    </style>
</head>
