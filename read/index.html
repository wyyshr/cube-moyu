<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读</title>
    <style>
        ::selection {
            background: #C7C7C7;
        }

        * {
            padding: 0;
            border: 0;
            margin: 0;
        }

        body {
            background-color: #ECE7E1;
            height: 100vh;
            overflow: hidden;
        }

        .area {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .top {
            width: 100%;
            min-height: 80px;
        }

        .upload {
            height: 100px;
            display: flex;
            align-items: center;
            width: 99%;
            background-color: #fff;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(76, 76, 76, 0.5);
            border-radius: 5px;
            justify-content: space-between;
        }

        .content {
            flex: 6;
            display: flex;
            justify-content: center;
        }

        .textarea {
            flex: 1;
            width: 40%;
            font-size: 20px;
            padding: 80px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            /* border: 1px #2d2d2d solid; */
            /* box-shadow: 0 0 5px rgba(76, 76, 76, 0.5); */
        }

        .textarea:focus {
            /* border: 1px #007BFF solid; */
            outline: none;
        }

        .upper {
            display: flex;
            justify-content: space-between;
            padding: 15px;
        }

        .upper .left {
            display: flex;
            align-items: center;
            width: 600px;
            justify-content: space-between;
        }

        .upper .right {
            display: flex;
            align-items: center;
            width: 150px;
            justify-content: space-between;
        }

        .right .icon {
            width: 25px;
            height: 25px;
        }

        .down {
            display: flex;
            width: 500px;
            justify-content: space-between;
            padding: 0 0 5px 15px;
        }

        .tools_item {
            font-size: 14px;
        }

        .right .icon:hover,
        .tools_item:hover {
            cursor: pointer;
        }

        .selected {
            border-bottom: 2px solid #1651AA;
            font-weight: 700;
        }

        .fontSize {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 30%;
            margin-left: 20px;
        }

        .addBtn {
            width: 100px;
            height: 50px;
        }

        .bg {
            background-image: url(./assets/duanluo.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: right;
        }

        .mask {
            width: 100vw;
            height: 100vh;
            background-color: #00000072;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
            z-index: 1;
        }

        .model {
            width: 500px;
            /* height: 500px; */
            border-radius: 5px;
            background-color: #fff;
            padding: 40px;
        }

        .confirm_btn {
            width: 150px;
            height: 50px;
            background-color: #5390ec;
            color: #fff;
            font-size: 16px;
            border-radius: 5px;
        }

        .confirm_btn:hover {
            cursor: pointer;
            background-color: #6a9ce8;
        }

        .confirm_btn:active {
            background-color: #5390ec;
        }

        .fullScreen {
            position: fixed;
            right: 50px;
            bottom: 50px;
            background-color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullScreen:hover {
            cursor: pointer;
        }

        .add_btn {
            width: 100px;
            height: 50px;
            background-color: #5390ec;
            color: #fff;
            border-radius: 5px;
        }

        .add_btn:hover {
            cursor: pointer;
            background-color: #6a9ce8;
        }

        .add_btn:active {
            background-color: #5390ec;
        }

        .upload_area {
            display: flex;
            align-items: center;
            position: relative;
            background-color: #7a7ae8;
            height: 50px;
            color: #fff;
            border-radius: 5px;
        }

        .upload_icon:hover,
        #uploadFile:hover {
            cursor: pointer;
        }

        .upload_area:hover {
            background-color: #8c8cf3;
        }

        #uploadFile {
            opacity: 0;
            width: 100px;
            height: 50px;
        }

        .upload_icon {
            width: 20px;
            height: 20px;
            position: absolute;
            left: 10px;
        }

        .bottom_tip {
            background-color: #F5F5F5;
            width: 100%;
            height: 25px;
            position: fixed;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #343434;
        }

        .tip_item {
            margin: 5px 10px;
        }

        .tip_item:hover {
            cursor: pointer;
        }

        .switch_btn {
            width: 100px;
            height: 25px;
            line-height: 25px;
            text-align: center;
            background-color: #e1e1e1;
            box-shadow: 0 0 5px rgba(76, 76, 76, 0.5);
        }

        .switch_btn:hover {
            cursor: pointer;
            background-color: #ffffff;
            /* border: 1px solid #353535; */
        }

        .switch_btn:active {
            background-color: #e1e1e1;
        }

        .tutorial_btn {
            color: #000;
            border-bottom: 1px solid #000;
        }
        .tutorial_btn:hover {
            color: #7e7e7e;
            border-bottom: 1px solid #7e7e7e;
        }
    </style>
</head>

                <span>上传文本：</span>
                <textarea class="text_input"
                    style="background-color: #f5f5f5; width: 350px;height: 350px;padding: 20px;margin-bottom: 20px;border-radius: 10px;"
                    name="" id="" placeholder="输入阅读文本"></textarea>
            </div>
            <div class="bottom" style="text-align: center;">
                <button class="confirm_btn">确认</ style="width: 100px;">
            </div>
            <div style="text-align: center;font-size: 12px;color: #949494;margin-top: 20px;">点击其他区域关闭弹窗</div>
        </div>
    </div>
